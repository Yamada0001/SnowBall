# SnowBall 实验功能配置。三项功能默认关闭；修改后需要重启服务器。
# 键、层级和初始值以战略书所钉定的 DivineMC 配置源码为对照；中文注释说明运行语义和移植限制。
# Fish 的 async.world-ticking 是另一套实现，不作为本文件的别名；详见战略书。

async:
  # DivineMC 会同时启用世界并行与区块区域并行，并改写两边的线程数；少于 6 个可用 CPU 时忽略。
  # 本次不移植区域并行。SnowBall 若读到 true，必须明确警告并让世界并行保持禁用，不能静默改变含义。
  auto-thread-allocation: false

  # 专家模式。上游还要求 JVM 参数 -Ddivinemc.async.guru=true；仅配置此值不生效。
  guru-mode-enable: false
  guru-mode:
    # Parallel Sensor Phase 工作者允许绑定的 CPU 编号列表；空列表不绑定，不影响其他线程池。
    # 需要专家模式和系统属性同时启用；平台不支持或列表无效时，必须记录原因，不得声称绑定成功。
    parallel-sensors-affinity: []

  parallel-world-ticking:
    # 实验性：符合限制的空闲世界可以并行执行整轮 tick；所有任务结束后主线程才继续。
    # 仅限无插件、无人且无加载区块等受控场景，至少需两个连续合格的世界；不建议用于生产服。
    enable: false
    # 同时执行世界 tick 的上限，不是世界数量。DivineMC 默认 4；SnowBall 试验范围为 2–16（更高按 16，1 不启用并行）。
    thread-count: 4
    # 世界并行配置有效时采集菜单创建调用栈，在菜单关闭时记录；诊断也覆盖串行世界，长期开启会增加开销。
    log-container-creation-stacktraces: false
    # 上游用于关闭部分线程归属异常；存在世界数据损坏风险。
    # SnowBall 安全门槛：保留同名键，但不允许它关闭世界线程检查；true 必须明确警告并让世界并行保持禁用。
    disable-hard-throw: false
    # 世界并行配置有效时，允许在线玩家用 /tpsbar 开关 TPS 栏；不要求当前世界正由 worker 执行。
    use-per-world-tps-bar: true
    # true 显示全服 TPS，false 显示玩家当前维度的 TPS；按最近约 5 秒的 tick 节奏计算，不是 MSPT。
    show-tps-of-server-instead-of-world: true

  parallel-sensors:
    # 在实体 tick 前并行执行已审计的 AI 感知工作；未纳入白名单的传感器继续原同步流程。
    enable: false
    # 正数直接使用；0 = max(可用 CPU 核数 / 4 向下取整, 1)；负数 = max(可用 CPU 核数 + 值, 1)。
    # 原注释把 <=0 一起描述为四分之一，但负值实际走减核分支；按执行逻辑兼容。
    max-threads: 0

network:
  raytrace-entity-culling:
    # 只改变观察者的实体追踪/定位栏，不删除实体或暂停实体 tick；不能覆盖插件的隐藏规则。
    # 只有确认完全被遮挡时才隐藏。视线恢复后重新配对；高延迟玩家可能看到实体稍晚出现。
    enabled: false
    # 所有玩家共享线程池；正数直接使用，<=0 时取可用 CPU 核数 / 8 向下取整并限制在 1–4。
    threads: 0
    # 可见性检查请求间隔（毫秒），至少 10；为提前续检，实际调度间隔上限约 167，不会延长遮挡证明。
    check-interval-ms: 50
    # 射线检测最大距离（方块），执行时限制在 16–160；更远的实体不由本功能隐藏。
    # 上游每位观察者的遮挡缓存约占 (2×距离)^3/4 字节；64 时约 512 KiB，不含其他开销。
    max-trace-distance: 64
    # 半径内始终通过本功能的可见性检查，不作射线检测（方块）。
    force-visible-radius: 4.0
    # 实体被证实可见后，维持可见的最短时间（毫秒），避免反复配对/取消配对。
    visibility-timeout-ms: 1000
    # 射线检测前向外扩张实体包围盒的距离（方块）；值越大，拐角处越早恢复可见。
    aabb-expansion: 0.5
    # 任一维度超过此大小的包围盒不被剔除（方块）。
    bounding-box-limit: 20
    # 是否也处理普通玩家；高延迟 PvP 场景需单独测拐角重现时机。
    cull-players: true
    # 上游实际匹配的是隐形盔甲架，不额外要求 Marker 标记；常用于全息或插件标记。
    skip-marker-armor-stands: true
    # 附加豁免实体类型，如 [minecraft:item_frame, minecraft:villager]。
    # 大小写归一化；未带 minecraft: 前缀的按原规则补齐；未知类型告警。
    # 发光、常显自定义名称、展示实体与鱼漂等原生豁免不由此列表关闭。
    skipped-entity-types: []
