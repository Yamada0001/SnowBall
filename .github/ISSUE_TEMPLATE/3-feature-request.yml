name: 新的需求 | Feature Request
description: 
  为 SnowBall 提供新的想法。
  Suggest an idea for SnowBall.
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        感谢您为 SnowBall 提交新的需求！请尽可能详细地描述，以便我们可以更轻松地考虑和审查请求。
        Thank you for submitting a feature request for SnowBall! Please include enough detail for us to review it.<br>
        请先搜索现有 Issue，避免重复提交。如果已有对应请求，欢迎在原帖补充信息。
        Search existing issues before opening a request. If one already exists, add any new details there.<br>
        在请求新功能之前，请确认最新版 SnowBall 尚未提供该功能。
        Before requesting a new feature, check that it is not already in the latest SnowBall build.<br>
        我们的开发人员可能没有过多时间来测试新功能的可用性，如新功能进入 Test 状态，您可以帮助我们进行测试并回复。
        Our developers may not have much time to test the usability of new functions. If the new functions enter the Test state, you can help us test and reply.

  - type: textarea
    id: feature
    attributes:
      label: 描述你希望添加的功能。 Describe the feature you'd like.
      placeholder: e.g. 可以给指定的假人设置俯仰角和偏向角
    validations:
      required: true
  - type: textarea
    id: other
    attributes:
      label: 其他 Other
      description: 添加其他的信息。 Add any other context or screenshots about the feature request below.
