name: Build and Release

on:
  push:
    branches:
      - dev/26.3
      - master
      - main
  workflow_dispatch:
    inputs:
      skip_release:
        description: "只构建，不创建 Release"
        type: boolean
        default: false
      prerelease:
        description: "把本次 Release 标记为预发布"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "zulu"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          add-job-summary: never
          cache-read-only: false

      - name: Configure Git
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "SnowBall Release CI"

      - name: Apply patches
        run: ./gradlew applyAllPatches

      # --rerun 是必须的：jar 的 MANIFEST 里写了 Instant.now() 生成的 Build-Time，
      # 每次构建字节都不同。若 leavesclip 的 patch target 与 patches.list 记录的
      # outputHash 来自不同批次，运行时会报 "Patch not applied correctly"。
      # 全量重跑保证两者同批次。
      - name: Build SnowBall server jar
        run: ./gradlew :snowball-server:createLeavesclipJar --rerun
        env:
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Collect SnowBall artifact
        id: meta
        run: bash scripts/GetReleaseInfo.sh

      - name: Verify SnowBall release jar
        env:
          ARTIFACT: ${{ steps.meta.outputs.artifact }}
        run: python3 scripts/VerifyReleaseJar.py "$ARTIFACT"

      - name: Write release notes
        env:
          MC_VERSION: ${{ steps.meta.outputs.mc_version }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          JAR_NAME: ${{ steps.meta.outputs.jar }}
          JAR_SHA256: ${{ steps.meta.outputs.sha256 }}
        run: |
          set -euo pipefail
          {
            echo "### 提交"
            echo
            git log -1 --pretty='- `%h` %s'
            echo
            echo "### 构建信息"
            echo
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| Minecraft | ${MC_VERSION} |"
            echo "| 构建号 | ${GITHUB_RUN_NUMBER} |"
            echo "| 提交 | \`${SHORT_SHA}\` |"
            echo "| 分支 | \`${GITHUB_REF_NAME}\` |"
            echo "| Java | 25 |"
            echo
            echo "### 校验"
            echo
            echo '```'
            printf '%s  %s\n' "$JAR_SHA256" "$JAR_NAME"
            echo '```'
          } > release-notes.md

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.jar }}
          path: ${{ steps.meta.outputs.artifact }}
          if-no-files-found: error

      - name: Create Release
        if: github.event_name == 'push' || inputs.skip_release == false
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          body_path: release-notes.md
          files: ${{ steps.meta.outputs.artifact }}
          draft: false
          prerelease: ${{ inputs.prerelease == true }}
          make_latest: ${{ inputs.prerelease != true }}
          generate_release_notes: false
