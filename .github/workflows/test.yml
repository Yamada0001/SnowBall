name: SnowBall Test CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "zulu"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          add-job-summary: never
          cache-read-only: false
      - name: Configure Git for patch application
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "SnowBall Test CI"
      - name: Apply patches
        run: ./gradlew applyAllPatches
      - name: Test API and server
        run: ./gradlew :snowball-api:test :snowball-server:test
      - name: Build SnowBall server jar
        run: ./gradlew :snowball-server:createLeavesclipJar --rerun
      - name: Collect SnowBall artifact
        id: meta
        run: bash scripts/GetReleaseInfo.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.jar }}
          path: ${{ steps.meta.outputs.artifact }}
          if-no-files-found: error
