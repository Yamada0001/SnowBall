name: "Issues: Check SnowBall version"

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - name: Compare with SnowBall releases
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            if (!issue.labels.some(label => label.name === 'status: needs triage')) return;

            const section = (issue.body ?? '').split(/\r?\n### /).find(part =>
              part.startsWith('服务端版本 SnowBall Version\n') ||
              part.startsWith('服务端版本 SnowBall Version\r\n'));
            const reported = section?.match(/\bSnowBall version ([0-9][0-9A-Za-z._+-]*?)-([1-9][0-9]*)-[^\s@]+@([0-9a-f]{7,40})(?![0-9A-Za-z])/i);
            if (!reported) return;
            const [, game, build, commit] = reported;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              ...context.repo, per_page: 100,
            });
            const candidates = [];
            for (const release of releases) {
              if (release.draft) continue;
              const tag = release.tag_name.match(/^(.+)-([1-9][0-9]*)-([0-9a-f]{7,40})$/);
              if (!tag || tag[1] !== game) continue;
              const [, , number, sha] = tag;
              const expectedName = `SnowBall-${game}-${sha}.jar`;
              if (release.assets.some(asset => asset.state === 'uploaded' && asset.name === expectedName)) {
                candidates.push({release, number: BigInt(number), sha});
              }
            }
            const current = candidates.find(candidate =>
              candidate.number === BigInt(build) && candidate.sha === commit.toLowerCase());
            if (!current) return;
            const latest = candidates.filter(candidate => current.release.prerelease || !candidate.release.prerelease)
              .reduce((best, candidate) => candidate.number > best.number ? candidate : best, current);
            if (latest.number <= current.number) return;
            await github.rest.issues.createComment({
              ...context.repo, issue_number: issue.number,
              body: `发现更新的 SnowBall 构建：${latest.release.tag_name}。请更新后再尝试复现。\nA newer SnowBall build is available: ${latest.release.html_url}. Please retest with it.`,
            });
